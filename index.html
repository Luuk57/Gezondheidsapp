<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasker - Dialyse & Gezondheidsmonitor</title>
    <!-- Tailwind CSS voor strakke, moderne mobiele styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-20">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <h1 class="text-xl font-bold">Tasker 🩺</h1>
            <span id="sync-status" class="text-xs bg-indigo-700 px-2 py-1 rounded-full">Verbinden...</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto p-4 space-y-4">

        <!-- TAB 1: DIALYSE & VOCHT -->
        <section id="tab-dialyse" class="tab-content active space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                <h2 class="text-lg font-semibold text-indigo-600 mb-3">Nachtdialyse & UF Registratie</h2>
                
                <div class="space-y-3">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-gray-600">Datum 1 (Start avond):</label>
                            <input type="date" id="dialysis-date-1" class="w-full mt-1 p-2 border rounded-xl bg-gray-50 text-sm" oninput="autoSaveDraft()">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600">Datum 2 (Einde ochtend):</label>
                            <input type="date" id="dialysis-date-2" class="w-full mt-1 p-2 border rounded-xl bg-gray-50 text-sm" oninput="autoSaveDraft()">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-gray-600">Pre-gewicht (kg):</label>
                            <input type="number" step="0.1" id="pre-weight" placeholder="bijv. 112.5" class="w-full mt-1 p-2 border rounded-xl bg-gray-50 text-sm" oninput="calculateUF(); autoSaveDraft();">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600">Drooggewicht (kg):</label>
                            <input type="number" step="0.1" id="dry-weight" value="109" class="w-full mt-1 p-2 border rounded-xl bg-gray-50 text-sm font-medium text-indigo-600" oninput="calculateUF(); autoSaveDraft();">
                        </div>
                    </div>

                    <!-- UF Resultaat & Kleurcodering -->
                    <div id="uf-result-box" class="p-3 rounded-xl border transition-colors bg-gray-100 border-gray-200">
                        <p class="text-xs font-bold uppercase tracking-wider text-gray-500">UF Advies Formule (Pre - Droog + 0.3)</p>
                        <p id="uf-output" class="text-xl font-bold mt-1">-- L</p>
                        <p id="uf-status-text" class="text-xs mt-1 font-medium">Voer pre-gewicht in...</p>
                    </div>

                    <div class="grid grid-cols-3 gap-2">
                        <div>
                            <label class="block text-xs font-medium text-gray-600">Post-gewicht:</label>
                            <input type="number" step="0.1" id="post-weight" placeholder="kg" class="w-full mt-1 p-2 border rounded-xl bg-gray-50 text-sm" oninput="autoSaveDraft()">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600">Gebruikte UF:</label>
                            <input type="number" step="0.1" id="used-uf" placeholder="L" class="w-full mt-1 p-2 border rounded-xl bg-gray-50 text-sm" oninput="autoSaveDraft()">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600">Werkelijke UF:</label>
                            <input type="number" step="0.1" id="actual-uf" placeholder="L" class="w-full mt-1 p-2 border rounded-xl bg-gray-50 text-sm" oninput="autoSaveDraft()">
                        </div>
                    </div>

                    <!-- Verpleging Selectie & Toevoegen -->
                    <div class="space-y-2">
                        <label class="block text-xs font-medium text-gray-600">Aanwezige Verpleging (Meerdere selecteerbaar):</label>
                        <select id="nurses-select" multiple class="w-full p-2 border rounded-xl bg-gray-50 text-sm h-24" onchange="autoSaveDraft()">
                            <!-- Wordt dynamisch gevuld -->
                        </select>
                        
                        <!-- Veldje om nieuwe verpleging toe te voegen -->
                        <div class="flex gap-2">
                            <input type="text" id="new-nurse-name" placeholder="Naam nieuwe verpleging..." class="flex-1 p-2 border rounded-xl bg-gray-50 text-sm">
                            <button onclick="addNewNurse()" type="button" class="bg-gray-200 text-gray-700 px-3 py-2 rounded-xl text-sm font-medium hover:bg-gray-300">Toevoegen</button>
                        </div>
                    </div>

                    <!-- Verslag / Notities -->
                    <div>
                        <label class="block text-xs font-medium text-gray-600">Verslag / Bijzonderheden:</label>
                        <textarea id="dialysis-report" rows="2" placeholder="Bijv. rustige nacht, geen krampen..." class="w-full mt-1 p-2 border rounded-xl bg-gray-50 text-sm" oninput="autoSaveDraft()"></textarea>
                    </div>

                    <button onclick="saveDialysis()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-semibold shadow-md active:bg-indigo-700">Dialyse Sessie Definitief Opslaan</button>
                </div>
            </div>
        </section>

        <!-- TAB 2: ETEN & DRINKEN -->
        <section id="tab-voeding" class="tab-content space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                <h2 class="text-lg font-semibold text-indigo-600 mb-3">Drinken & Eten Bijhouden</h2>
                <div class="space-y-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Type (Drinken / Eten):</label>
                        <select id="food-type" class="w-full mt-1 p-2 border rounded-xl bg-gray-50">
                            <option value="drinken">Drinken (Vocht)</option>
                            <option value="eten">Eten / Maaltijd</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Omschrijving & Hoeveelheid (ml/g):</label>
                        <input type="text" id="food-desc" placeholder="bijv. Water 250ml of Broodje" class="w-full mt-1 p-2 border rounded-xl bg-gray-50">
                    </div>
                    <button onclick="saveFood()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-semibold shadow-md">Toevoegen</button>
                </div>
            </div>
        </section>

        <!-- TAB 3: MEDICIJNEN -->
        <section id="tab-medicijnen" class="tab-content space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                <h2 class="text-lg font-semibold text-indigo-600 mb-3">Medicijn Schema</h2>
                <div class="space-y-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Medicijnnaam & Dosering:</label>
                        <input type="text" id="med-name" placeholder="bijv. Fosfaatbinder 500mg" class="w-full mt-1 p-2 border rounded-xl bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Tijdstip:</label>
                        <input type="time" id="med-time" class="w-full mt-1 p-2 border rounded-xl bg-gray-50">
                    </div>
                    <button onclick="saveMedication()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-semibold shadow-md">Medicijn Opslaan</button>
                </div>
            </div>
        </section>

        <!-- TAB 4: VERVOER -->
        <section id="tab-vervoer" class="tab-content space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                <h2 class="text-lg font-semibold text-indigo-600 mb-3">Vervoer / Ritten</h2>
                <div class="space-y-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Bestemming / Afspraak:</label>
                        <input type="text" id="transport-desc" placeholder="bijv. Dialysecentrum Taxi" class="w-full mt-1 p-2 border rounded-xl bg-gray-50">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600">Datum & Tijd:</label>
                        <input type="datetime-local" id="transport-date" class="w-full mt-1 p-2 border rounded-xl bg-gray-50">
                    </div>
                    <button onclick="saveTransport()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-semibold shadow-md">Rit Inplannen</button>
                </div>
            </div>
        </section>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 py-2 shadow-lg z-50">
        <div class="max-w-md mx-auto flex justify-around">
            <button onclick="switchTab('dialyse')" id="nav-dialyse" class="flex flex-col items-center text-indigo-600 font-medium text-xs">
                <span class="text-xl">🩺</span>Dialyse
            </button>
            <button onclick="switchTab('voeding')" id="nav-voeding" class="flex flex-col items-center text-gray-400 font-medium text-xs">
                <span class="text-xl">💧</span>Voeding
            </button>
            <button onclick="switchTab('medicijnen')" id="nav-medicijnen" class="flex flex-col items-center text-gray-400 font-medium text-xs">
                <span class="text-xl">💊</span>Medicijn
            </button>
            <button onclick="switchTab('vervoer')" id="nav-vervoer" class="flex flex-col items-center text-gray-400 font-medium text-xs">
                <span class="text-xl">🚕</span>Vervoer
            </button>
        </div>
    </nav>

    <!-- Firebase SDK & App Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBmdTCE0AE8CQ9R-DL36bifn6p9hPwtm0s",
          authDomain: "datakluis-fdc4a.firebaseapp.com",
          projectId: "datakluis-fdc4a",
          storageBucket: "datakluis-fdc4a.firebasestorage.app",
          messagingSenderId: "97221438499",
          appId: "1:97221438499:web:554415c0de9ff85f309596"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;

        document.getElementById('sync-status').innerText = "Cloud Online 🟢";
        
        // Laad verpleging lijst en concept bij opstarten
        initNursesList();
        loadDraft();
    </script>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(el => {
                el.classList.remove('text-indigo-600');
                el.classList.add('text-gray-400');
            });

            document.getElementById('tab-' + tabName).classList.add('active');
            document.getElementById('nav-' + tabName).classList.remove('text-gray-400');
            document.getElementById('nav-' + tabName).classList.add('text-indigo-600');
        }

        // Standaard verpleging en opslag in browser
        function getNursesList() {
            const saved = localStorage.getItem('tasker_nurses_list');
            if (saved) {
                return JSON.parse(saved);
            }
            return ["Jan", "Sophie", "Mohammed", "Lisa", "Anja"];
        }

        function initNursesList() {
            const select = document.getElementById('nurses-select');
            const nurses = getNursesList();
            select.innerHTML = '';
            nurses.forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.innerText = name;
                select.appendChild(opt);
            });
        }

        function addNewNurse() {
            const input = document.getElementById('new-nurse-name');
            const name = input.value.trim();
            if (!name) return;

            let nurses = getNursesList();
            if (!nurses.includes(name)) {
                nurses.push(name);
                localStorage.setItem('tasker_nurses_list', JSON.stringify(nurses));
                initNursesList();
                
                // Selecteer direct de net toegevoegde verpleegkundige
                const select = document.getElementById('nurses-select');
                for (let opt of select.options) {
                    if (opt.value === name) opt.selected = true;
                }
                input.value = '';
                autoSaveDraft();
            } else {
                alert("Deze naam staat al in de lijst.");
            }
        }

        function autoSaveDraft() {
            const nursesSelect = document.getElementById('nurses-select');
            const selectedNurses = Array.from(nursesSelect.selectedOptions).map(opt => opt.value);

            const draft = {
                date1: document.getElementById('dialysis-date-1').value,
                date2: document.getElementById('dialysis-date-2').value,
                preWeight: document.getElementById('pre-weight').value,
                dryWeight: document.getElementById('dry-weight').value,
                postWeight: document.getElementById('post-weight').value,
                usedUF: document.getElementById('used-uf').value,
                actualUF: document.getElementById('actual-uf').value,
                nurses: selectedNurses,
                report: document.getElementById('dialysis-report').value
            };
            localStorage.setItem('tasker_dialysis_draft', JSON.stringify(draft));
        }

        function loadDraft() {
            const saved = localStorage.getItem('tasker_dialysis_draft');
            if (saved) {
                const draft = JSON.parse(saved);
                if (draft.date1) document.getElementById('dialysis-date-1').value = draft.date1;
                if (draft.date2) document.getElementById('dialysis-date-2').value = draft.date2;
                if (draft.preWeight) document.getElementById('pre-weight').value = draft.preWeight;
                if (draft.dryWeight) document.getElementById('dry-weight').value = draft.dryWeight;
                if (draft.postWeight) document.getElementById('post-weight').value = draft.postWeight;
                if (draft.usedUF) document.getElementById('used-uf').value = draft.usedUF;
                if (draft.actualUF) document.getElementById('actual-uf').value = draft.actualUF;
                if (draft.report) document.getElementById('dialysis-report').value = draft.report;
                
                if (draft.nurses && Array.isArray(draft.nurses)) {
                    const nursesSelect = document.getElementById('nurses-select');
                    Array.from(nursesSelect.options).forEach(opt => {
                        opt.selected = draft.nurses.includes(opt.value);
                    });
                }
                calculateUF();
            } else {
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('dialysis-date-1').value = today;
                document.getElementById('dialysis-date-2').value = today;
            }
        }

        function calculateUF() {
            const preWeight = parseFloat(document.getElementById('pre-weight').value);
            const dryWeight = parseFloat(document.getElementById('dry-weight').value);
            const box = document.getElementById('uf-result-box');
            const output = document.getElementById('uf-output');
            const statusText = document.getElementById('uf-status-text');

            if (isNaN(preWeight) || isNaN(dryWeight)) {
                output.innerText = "-- L";
                box.className = "p-3 rounded-xl border transition-colors bg-gray-100 border-gray-200";
                statusText.innerText = "Voer gewichten in...";
                return;
            }

            const uf = preWeight - dryWeight + 0.3;
            output.innerText = uf.toFixed(2) + " L";

            if (uf >= 4.5) {
                box.className = "p-3 rounded-xl border transition-colors bg-red-50 border-red-300 text-red-900";
                statusText.innerText = "⚠️ Hoog UF-advies (>= 4.5)";
            } else if (uf >= 4.0) {
                box.className = "p-3 rounded-xl border transition-colors bg-amber-50 border-amber-300 text-amber-900";
                statusText.innerText = "⚡ Matig UF-advies (>= 4.0)";
            } else {
                box.className = "p-3 rounded-xl border transition-colors bg-green-50 border-green-300 text-green-900";
                statusText.innerText = "✅ Veilig UF-advies (< 4.0)";
            }
        }

        async function saveDialysis() {
            try {
                if (!window.db) {
                    alert("Database nog niet verbonden.");
                    return;
                }

                const nursesSelect = document.getElementById('nurses-select');
                const selectedNurses = Array.from(nursesSelect.selectedOptions).map(opt => opt.value);

                const data = {
                    date1: document.getElementById('dialysis-date-1').value,
                    date2: document.getElementById('dialysis-date-2').value,
                    preWeight: document.getElementById('pre-weight').value,
                    dryWeight: document.getElementById('dry-weight').value,
                    postWeight: document.getElementById('post-weight').value,
                    usedUF: document.getElementById('used-uf').value,
                    actualUF: document.getElementById('actual-uf').value,
                    nurses: selectedNurses,
                    report: document.getElementById('dialysis-report').value,
                    timestamp: new Date()
                };

                await window.addDoc(window.collection(window.db, "dialyse"), data);
                localStorage.removeItem('tasker_dialysis_draft');
                alert("Dialyse sessie definitief opgeslagen in je Datakluis!");
            } catch (e) {
                alert("Fout bij opslaan: " + e.message);
            }
        }

        async function saveFood() {
            try {
                const data = {
                    type: document.getElementById('food-type').value,
                    description: document.getElementById('food-desc').value,
                    timestamp: new Date()
                };
                await window.addDoc(window.collection(window.db, "voeding"), data);
                document.getElementById('food-desc').value = '';
                alert("Voeding/Drinken opgeslagen!");
            } catch (e) {
                alert("Fout: " + e.message);
            }
        }

        async function saveMedication() {
            try {
                const data = {
                    name: document.getElementById('med-name').value,
                    time: document.getElementById('med-time').value,
                    timestamp: new Date()
                };
                await window.addDoc(window.collection(window.db, "medicijnen"), data);
                document.getElementById('med-name').value = '';
                alert("Medicijn opgeslagen!");
            } catch (e) {
                alert("Fout: " + e.message);
            }
        }

        async function saveTransport() {
            try {
                const data = {
                    description: document.getElementById('transport-desc').value,
                    date: document.getElementById('transport-date').value,
                    timestamp: new Date()
                };
                await window.addDoc(window.collection(window.db, "vervoer"), data);
                document.getElementById('transport-desc').value = '';
                alert("Rit ingepland!");
            } catch (e) {
                alert("Fout: " + e.message);
            }
        }
    </script>
</body>
</html>
